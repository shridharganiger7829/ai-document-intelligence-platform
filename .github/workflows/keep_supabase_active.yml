name: Keep Supabase Active (Heartbeat)

on:
  schedule:
    # Runs every 3 days at 06:00 UTC (Supabase pauses after 7 days of inactivity)
    - cron: '0 6 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI anytime
  push:
    paths:
      - '.github/workflows/keep_supabase_active.yml'
      - 'scripts/keep_supabase_active.py'

jobs:
  heartbeat:
    name: Ping Supabase Database & API
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]>=3.1.0"

      - name: Execute Supabase Keep-Alive Heartbeat
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python scripts/keep_supabase_active.py

      - name: Log Execution Summary
        if: always()
        run: |
          echo "### Supabase Keep-Alive Execution Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Execution Time (UTC)**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Supabase project successfully registered activity and will remain active." >> $GITHUB_STEP_SUMMARY
